[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
ciborium = "0.2.1"
# Single crates.io dependency — the dgs scene/render engine.
# default-features is off to keep the WASM plugin lean (no PNG rasterizer).
# dgs = { version = "0.1", default-features = false }
dgs = { path = "../dgs/crates/dgs", default-features = false }

[profile.release]
lto = true
strip = true
opt-level = 'z'
codegen-units = 1
panic = 'abort'
